<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:">
<title>Argus News</title>
<style>
/* Scrollbalken: schmal und gläsern statt grauer Windows-Balken, ohne Pfeile */
::-webkit-scrollbar { width: 5px; height: 5px; background: transparent; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, rgba(190,225,255,.32), rgba(120,170,230,.16)); border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, rgba(200,235,255,.55), rgba(130,185,240,.3)); }
::-webkit-scrollbar-button, ::-webkit-scrollbar-corner { display: none; width: 0; height: 0; background: transparent; }

:root { --wh: 219; --ws: 54%; --wl: 5%; --bg: hsl(var(--wh) var(--ws) var(--wl)); --card: hsl(var(--wh) var(--ws) calc(var(--wl) + 4%)); --line: hsl(var(--hue, 205) 60% 70% / 0.16); --ink: #e3ecf6; --dim: hsl(var(--wh) 18% 60%); --acc: hsl(var(--hue, 205) 85% 62%);
  --f-mono: "Cascadia Mono", "Consolas", ui-monospace, monospace; --f-ui: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.35 var(--f-ui); overflow: hidden; user-select: none; }
body { display: flex; flex-direction: column; border: 1px solid var(--line); }
header { -webkit-app-region: drag; display: flex; align-items: center; gap: 6px; padding: 7px 8px 7px 12px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
header h1 { margin: 0; flex: 1; font: 600 11px var(--f-mono); letter-spacing: 0.22em; color: var(--dim); }
header button { -webkit-app-region: no-drag; width: 24px; height: 24px; border: 1px solid var(--line); background: transparent; color: var(--dim); border-radius: 7px; cursor: pointer; display: grid; place-items: center; padding: 0; }
header button:hover { color: var(--ink); background: rgba(255, 255, 255, 0.06); }
header button.x:hover { background: #c42b1c; border-color: #c42b1c; color: #fff; }
header button svg { width: 13px; height: 13px; }
main { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.btc { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: end; }
.btc:hover { border-color: var(--acc); }
.btc .lbl { font: 600 10px var(--f-mono); letter-spacing: 0.16em; color: var(--dim); grid-column: 1 / -1; }
.btc .price { font: 600 24px var(--f-ui); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.btc .chg { font: 600 13px var(--f-mono); }
.up { color: #3ecf8e; } .down { color: #ff6b6b; }
.btc canvas { grid-column: 1 / -1; width: 100%; height: 34px; }
.coins { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; } .coins:empty { display: none; }
.coin { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 0 8px; align-items: baseline; }
.coin:hover { border-color: var(--acc); }
.coin .lbl { font: 600 10px var(--f-mono); letter-spacing: 0.14em; color: var(--dim); }
.coin .price { font: 600 15px var(--f-ui); font-variant-numeric: tabular-nums; grid-column: 1 / -1; }
.coin .chg { font: 600 11px var(--f-mono); }
.coin canvas { grid-column: 1 / -1; width: 100%; height: 26px; margin-top: 4px; }
.btc .src { grid-column: 1 / -1; font-size: 11px; color: var(--dim); }
main > * { flex-shrink: 0; }
section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
section h2 { margin: 0; padding: 8px 12px 6px; font: 600 10px var(--f-mono); letter-spacing: 0.16em; color: var(--dim); display: flex; justify-content: space-between; cursor: pointer; }
section h2 span:last-child { letter-spacing: 0; }
section.closed ol { display: none; }
ol { list-style: none; margin: 0; padding: 0 4px 4px; }
li { padding: 6px 8px; border-radius: 7px; cursor: pointer; display: grid; grid-template-columns: auto 1fr; gap: 0 8px; }
li:hover { background: rgba(255, 255, 255, 0.05); }
li .dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; background: var(--acc); opacity: 0.5; }
li.hoch .dot { background: #ff6b6b; opacity: 1; box-shadow: 0 0 8px #ff6b6b; } li.mittel .dot { background: #f5a524; opacity: 1; }
li b { font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
li small { grid-column: 2; color: var(--dim); font-size: 11px; }
li img { width: 22px; height: 22px; border-radius: 50%; grid-row: span 2; margin-top: 1px; }
li.voice small { color: #3ecf8e; }
.head { padding: 2px 12px 2px; font-size: 11px; color: var(--dim); }
li.new b::after { content: " neu"; font: 600 9px var(--f-mono); color: var(--acc); vertical-align: 2px; }
.empty { padding: 4px 12px 10px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>NEWS</h1>
  <button id="refresh" title="Neu laden" aria-label="Neu laden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
  <button id="close" class="x" title="Schließen (in den Einstellungen wieder einschalten)" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</header>
<main id="main">
  <div class="btc" id="btc" title="Bei CoinMarketCap ansehen">
    <span class="lbl">BITCOIN</span><span class="price" id="price">–</span><span class="chg" id="chg"></span>
    <canvas id="spark"></canvas><span class="src" id="src">Lade Kurs…</span>
  </div>
  <div class="coins" id="coins"></div>
  <section id="sec-steam"><h2><span>STEAM</span><span id="n-steam"></span></h2><ol id="steam"></ol></section>
  <section id="sec-discord"><h2><span>DISCORD</span><span id="n-discord"></span></h2><ol id="discord"></ol></section>
  <section id="sec-alerts"><h2><span>AUFFÄLLIGKEITEN</span><span id="n-alerts"></span></h2><ol id="alerts"></ol></section>
  <section id="sec-krypto"><h2><span>KRYPTO</span><span id="n-krypto"></span></h2><ol id="krypto"></ol></section>
  <section id="sec-tech"><h2><span>TECH</span><span id="n-tech"></span></h2><ol id="tech"></ol></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const ago = (ts) => { if (!ts) return ""; const m = Math.round((Date.now() - ts) / 60000); return m < 1 ? "gerade eben" : m < 60 ? `vor ${m} Min.` : m < 1440 ? `vor ${Math.round(m / 60)} Std.` : `vor ${Math.round(m / 1440)} Tg.`; };
const num = (v) => v >= 100 ? Math.round(v).toLocaleString("de-DE") : v.toLocaleString("de-DE", { maximumFractionDigits: v >= 1 ? 2 : 4, minimumFractionDigits: v >= 1 ? 2 : 4 });
const money = (v, cur) => v == null ? "–" : cur === "EUR" ? num(v) + " €" : "$" + num(v);
const NAMES = { ETH: "ETHEREUM", SOL: "SOLANA", XRP: "XRP", LTC: "LITECOIN", DOGE: "DOGECOIN", KAS: "KASPA", BNB: "BNB", ADA: "CARDANO" };
const seen = new Set(JSON.parse(localStorageGet("seen") || "[]"));
function localStorageGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
let data = null, first = true;

function list(id, items, cats) {
  const sec = $("sec-" + id); sec.hidden = cats && cats[id === "alerts" ? "alerts" : id] === false;
  $("n-" + id).textContent = items?.length ? items.length : "";
  if (!items?.length) { $(id).replaceChildren(Object.assign(document.createElement("div"), { className: "empty", textContent: id === "alerts" ? "Nichts Auffälliges oder noch keine Daten." : "Noch keine Nachrichten geladen." })); return; }
  $(id).replaceChildren(...items.map((it) => {
    const li = document.createElement("li"); li.className = it.level || "";
    if (id !== "alerts" && !first && !seen.has(it.link)) li.classList.add("new");
    const dot = document.createElement("i"); dot.className = "dot";
    const b = document.createElement("b"); b.textContent = it.title;
    const s = document.createElement("small"); s.textContent = it.source + (it.ts && id !== "alerts" ? " · " + ago(it.ts) : "");
    li.title = it.title + "\n" + it.link; li.append(dot, b, s);
    li.addEventListener("click", () => { window.news.open(it.link); li.classList.remove("new"); });
    return li;
  }));
}
function spark(hist, cur, c = $("spark"), chg = null) {
  const r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  c.width = r.width * dpr; c.height = r.height * dpr;
  const g = c.getContext("2d"); g.scale(dpr, dpr);
  const pts = (hist || []).map((h) => h[cur === "EUR" ? 2 : 1]).filter((v) => typeof v === "number");
  if (pts.length < 2) { g.fillStyle = "#8296ad"; g.font = "11px Segoe UI"; g.fillText("Lade 24-h-Verlauf …", 0, Math.min(20, r.height - 6)); return; }
  // 24-h-Kurve mit Fläche, gestrichelte Linie = Stand vor 24 h
  const lo = Math.min(...pts), hi = Math.max(...pts), span = hi - lo || 1, up = typeof chg === "number" ? chg >= 0 : pts[pts.length - 1] >= pts[0], col = up ? "62,207,142" : "255,107,107";
  const X = (i) => (i / (pts.length - 1)) * r.width, Y = (v) => 3 + (1 - (v - lo) / span) * (r.height - 6);
  g.beginPath(); pts.forEach((v, i) => (i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v))));
  g.strokeStyle = `rgb(${col})`; g.lineWidth = 1.5; g.lineJoin = "round"; g.stroke();
  g.lineTo(r.width, r.height); g.lineTo(0, r.height); g.closePath();
  const gr = g.createLinearGradient(0, 0, 0, r.height); gr.addColorStop(0, `rgba(${col},0.28)`); gr.addColorStop(1, `rgba(${col},0)`); g.fillStyle = gr; g.fill();
  g.setLineDash([3, 4]); g.strokeStyle = "rgba(150,170,200,0.35)"; g.lineWidth = 1; g.beginPath(); g.moveTo(0, Y(pts[0])); g.lineTo(r.width, Y(pts[0])); g.stroke(); g.setLineDash([]);
}
// Weitere Coins als kleine Karten mit eigener 24-h-Kurve
function renderCoins() {
  const cur = data.cur || "USD", sel = (data.coinSel || []).filter((x) => x !== "BTC");
  $("coins").replaceChildren(...sel.map((sym) => {
    const q = data.coins?.[sym], v = q?.[cur.toLowerCase()], usd = q?.usd?.price, k = cur === "EUR" && usd && q?.eur?.price ? q.eur.price / usd : 1;
    const el = document.createElement("div"); el.className = "coin"; el.title = q ? "Quelle: " + q.source + " · " + ago(q.ts) : "Lade Kurs…";
    const l = Object.assign(document.createElement("span"), { className: "lbl", textContent: NAMES[sym] || sym }), ch = v?.change;
    const c = Object.assign(document.createElement("span"), { className: "chg " + (ch > 0 ? "up" : ch < 0 ? "down" : ""), textContent: typeof ch === "number" ? (ch > 0 ? "+" : "") + ch.toFixed(2).replace(".", ",") + " %" : "" });
    const p = Object.assign(document.createElement("span"), { className: "price", textContent: money(v?.price, cur) }), cv = document.createElement("canvas");
    el.append(l, c, p, cv); if (q?.url) el.addEventListener("click", () => window.news.open(q.url));
    requestAnimationFrame(() => spark((data.hists?.[sym] || []).map(([t, u]) => [t, u, u * k]), cur, cv, ch));
    return el;
  }));
}
function render() {
  if (!data) return;
  const cur = data.cur || "USD", q = data.btc?.[cur.toLowerCase()];
  const st = document.documentElement.style, w = data.win || {};
  st.setProperty("--hue", data.hue ?? 205); // Farben wie das Hauptfenster (Skin, Fensterfarbe)
  st.setProperty("--wh", String(Math.round(w.follow ? data.hue ?? 219 : w.h ?? 219))); st.setProperty("--ws", (w.s ?? 54) + "%"); st.setProperty("--wl", (w.l ?? 5) + "%");
  $("price").textContent = money(q?.price, cur);
  const ch = q?.change;
  $("chg").textContent = typeof ch === "number" ? (ch > 0 ? "+" : "") + ch.toFixed(2).replace(".", ",") + " % 24h" : "";
  $("chg").className = "chg " + (ch > 0 ? "up" : ch < 0 ? "down" : "");
  $("src").textContent = data.btc ? "Quelle: " + data.btc.source + " · " + ago(data.btc.ts) : data.btcError ? "Kurs nicht erreichbar: " + data.btcError : "Lade Kurs…";
  $("btc").hidden = data.cats?.btc === false;
  spark(data.hist, cur, $("spark"), ch); renderCoins();
  list("alerts", data.alerts, data.cats); list("krypto", data.krypto, data.cats); list("tech", data.tech, data.cats);
  if (data.tech?.length || data.krypto?.length) {
    // beim ersten Laden gilt alles als gelesen, danach markiert "neu" nur, was seitdem dazukam
    for (const it of [...(data.tech || []), ...(data.krypto || [])]) seen.add(it.link);
    localStorageSet("seen", JSON.stringify([...seen].slice(-400))); first = false;
  }
}
// Wer online ist: Spielende und Leute im Sprachkanal zuerst
function people(id, list, err, cat) {
  const sec = $("sec-" + id); sec.hidden = !cat || (!list && !err);
  if (sec.hidden) return;
  const rows = [];
  if (err) rows.push(Object.assign(document.createElement("div"), { className: "empty", textContent: err }));
  for (const g of list || []) {
    if (g.head) rows.push(Object.assign(document.createElement("div"), { className: "head", textContent: g.head }));
    for (const p of g.items) {
      const li = document.createElement("li"); if (p.voice) li.className = "voice";
      const img = document.createElement("img"); img.alt = ""; img.referrerPolicy = "no-referrer";
      if (p.avatar && /^https:/.test(p.avatar)) img.src = p.avatar; else img.style.visibility = "hidden";
      const b = document.createElement("b"); b.textContent = p.name;
      const s = document.createElement("small"); s.textContent = p.voice ? "im Sprachkanal " + p.voice : p.game ? "spielt " + p.game : p.state;
      li.append(img, b, s);
      if (p.url) { li.title = p.url; li.addEventListener("click", () => window.news.open(p.url)); }
      rows.push(li);
    }
    if (!g.items.length && !err) rows.push(Object.assign(document.createElement("div"), { className: "empty", textContent: g.none }));
  }
  $(id).replaceChildren(...rows);
}
function renderSocial() {
  const st = data.steam, dc = data.discord;
  people("steam", st && !st.error ? [{ head: st.me ? `Du: ${st.me.game ? "spielst " + st.me.game : st.me.state} · ${st.total} Freunde` : "", items: st.online, none: "Kein Freund online." }] : null, st?.error, data.cats?.steam);
  $("n-steam").textContent = st?.online?.length ?? "";
  const srv = dc?.servers || [];
  people("discord", srv.filter((x) => !x.error).map((x) => ({ head: `${x.server} · ${x.count} online`, items: x.online.map((m) => ({ ...m, url: x.url })), none: "Niemand online." })),
    [dc?.error, ...srv.filter((x) => x.error).map((x) => x.error)].filter(Boolean).join(" · "), data.cats?.discord);
  $("n-discord").textContent = srv.reduce((n, x) => n + (x.count || 0), 0) || "";
}
window.news.onMarket((d) => { data = d; render(); renderSocial(); });
setInterval(render, 60000); // "vor x Min." aktuell halten
addEventListener("resize", () => { if (data) { spark(data.hist, data.cur, $("spark"), data.btc?.[(data.cur || "USD").toLowerCase()]?.change); renderCoins(); } });
$("btc").addEventListener("click", () => data?.btc?.url && window.news.open(data.btc.url));
$("refresh").addEventListener("click", () => window.news.refresh());
$("close").addEventListener("click", () => window.news.close());
for (const h of document.querySelectorAll("section h2")) h.addEventListener("click", () => h.parentElement.classList.toggle("closed"));
</script>
</body>
</html>
