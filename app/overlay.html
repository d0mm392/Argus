<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:">
<title>Argus Sprachkanal</title>
<style>
/* Kleines Overlay: wer sitzt mit Domi im Discord-Sprachkanal. Klicks gehen durch. */
html, body { margin: 0; background: transparent; overflow: hidden; font: 12px/1.3 "Segoe UI", system-ui, sans-serif; color: #e6eef8; user-select: none; }
.box { margin: 4px; padding: 8px 10px; border-radius: 12px; background: rgba(6, 10, 18, 0.72); border: 1px solid hsl(var(--h, 205) 80% 60% / 0.45); box-shadow: 0 0 14px hsl(var(--h, 205) 90% 55% / 0.25); }
h1 { margin: 0 0 6px; font: 600 10px/1.2 "Cascadia Mono", Consolas, monospace; letter-spacing: 0.12em; text-transform: uppercase; color: hsl(var(--h, 205) 95% 72%); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p { display: flex; align-items: center; gap: 8px; height: 26px; }
.p img, .p i { width: 20px; height: 20px; border-radius: 50%; flex: none; background: hsl(var(--h, 205) 50% 30%); }
.p b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p small { margin-left: auto; color: #8ea3bb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
</style>
</head>
<body>
<div class="box"><h1 id="t"></h1><div id="list"></div></div>
<script>
window.news.onMarket((d) => {
  if (d.hue != null) document.documentElement.style.setProperty("--h", d.hue);
  const v = d.voice; if (!v) return;
  document.getElementById("t").textContent = "🔊 " + v.channel + " · " + v.server;
  document.getElementById("list").replaceChildren(...v.people.map((m) => {
    const r = document.createElement("div"); r.className = "p";
    let av; if (m.avatar && /^https:/.test(m.avatar)) { av = document.createElement("img"); av.src = m.avatar; av.referrerPolicy = "no-referrer"; av.onerror = () => av.replaceWith(document.createElement("i")); } else av = document.createElement("i");
    const b = document.createElement("b"); b.textContent = m.name;
    const s = document.createElement("small"); s.textContent = m.game || "";
    r.append(av, b, s); return r;
  }));
});
</script>
</body>
</html>
