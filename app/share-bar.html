<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
<title>Argus Übertragungsleiste</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 600 13px "Segoe UI", system-ui, sans-serif; }
  .bar { box-sizing: border-box; height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; border-radius: 19px; background: #b4232c; color: #fff; -webkit-app-region: drag; user-select: none; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #fff; flex: none; animation: p 1.4s ease-in-out infinite; }
  @keyframes p { 50% { opacity: .35; } }
  #txt { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { -webkit-app-region: no-drag; font: inherit; border: 0; border-radius: 14px; height: 28px; padding: 0 12px; cursor: pointer; }
  #show { background: rgba(255,255,255,.18); color: #fff; }
  #stop { background: #fff; color: #8f1820; }
</style></head>
<body><div class="bar"><span class="dot"></span><span id="txt">Übertragung läuft</span><button id="show" title="Übertragungsfenster zeigen">Fenster</button><button id="stop">Beenden</button></div>
<script src="share-bar.js"></script></body></html>
