releaseName: "Argus 0.58.23 – Notizen, Oberfläche und Brave"
releaseNotes: |
  # Argus 0.58.23 – Testkanal

  - **Notizen je Seite:** Start, Gaming, Mining, Trading und eigene Seiten speichern ihre Notizbücher unabhängig unter stabilen IDs, einschließlich Position und Größe. Gemeinsame Alt-Notizen werden einmalig Start zugeordnet und verlustfrei gesichert. Vorhandene Seitennotizen bleiben erhalten. Der letzte Text wird beim normalen Beenden bestätigt gespeichert; eine separate lokale Notizsicherung bleibt erhalten.
  - **Discord:** Sprachkanal-Teilnehmer bleiben unabhängig von Freundschaft oder Markierung sichtbar. Doppelte Discord-IDs werden zusammengeführt. Beliebige Online-Servermitglieder werden nicht mehr als zusätzliche Freunde angezeigt. Die Option „Online-Freunde zusätzlich anzeigen“ und ihr Markierungsfilter sind ausdrücklich **nicht verfügbar**, weil Argus keinen freigegebenen offiziellen Zugriff auf persönliche Freundschaften besitzt. Bot, Server-Widget und StreamKit ersetzen diesen Zugriff nicht. Bestehende Optionswerte und lokale Markierungen bleiben gespeichert.
  - **Einstellungen und Skins:** Acht Kategorien mit Suche, kompakteren Zeilen und Tastaturbedienung. Klassisch bleibt die Rückfallmöglichkeit; Apple-inspirierte helle und dunkle Skins mit Vorschau sind lokal enthalten. Keine zusätzlichen Schrift-/Icon-Dienste, Theme-Downloads oder neuen Abhängigkeiten. Animationen können reduziert werden.
  - **Darstellung im Hintergrund:** „Flüssig“ ist der neue Standard für sichtbare, inaktive Fenster; „Energiesparend“ erlaubt Drosselung. Beide sind über Einstellungen und Kontextmenü mit demselben Wert bedienbar. Minimierte oder ausgeblendete Fenster sparen weiterhin Ressourcen. Vorhandene Bildraten bleiben gespeichert; „Flüssig“ hebt den zusätzlichen Ruhemodus für sichtbare inaktive Fenster auf und kann mehr CPU/GPU benötigen.
  - **Rechtsklick:** Tastaturführung, Fokus, Auswahlzustände und Bildschirmposition verbessert; doppelte Notizblock-Bedienung entfernt. Textfelder erhalten das native Bearbeitungsmenü. Kontextbezogene Widget-Menüs bleiben erhalten.
  - **YouTube:** Standard ist nun das **echte vorhandene Brave** in einem separaten App-Fenster. Die bisherige Electron-Auswahl wird einmalig mit Sicherung des alten Modus umgestellt; spätere bewusste Einstellungen bleiben erhalten. Fehlt Brave, erscheint ein Hinweis statt eines stillen Engine-Wechsels. Electron-Modi bleiben ausdrücklich experimentell. Deren Filter wirken nicht auf Brave. Browserprofile, Cookies und Anmeldungen werden nicht kopiert oder ausgelesen. Brave-Fenster werden direkt dort bedient und geschlossen und beim Argus-Start nicht automatisch wieder geöffnet.
  - Der Portal-Startschutz aus 0.58.22 bleibt enthalten: automatische Downloads aus dem versteckten Portal werden vor dem Speicherdialog abgefangen; bewusst ausgelöste Downloads im geöffneten Portal bleiben möglich.

  ## Prüfungen und Grenzen

  Gezielte Prüfungen betreffen Migrationen, schnelle Notizeingaben und Seitenwechsel, bestätigtes Speichern beim Schließen, Skin-Wechsel und erneutes Laden, Suche, Tastatur, kleine Fenster, Discord-Sprachdaten und Menüs. Die bestehenden Hotfix- und Pfadschutztests laufen unter Node 20 und 24. Installer-Inhalt, Quellzuordnung, Manifest und Update-Prüfsummen werden für diesen Build separat abgeglichen.

  Zwei öffentliche Videos spielten in einer vorhandenen Brave-Installation mit getrenntem Testprofil: Bild, nachgewiesener Windows-Audiopegel der Testprozesse, Pause/Fortsetzen, Video-Wechsel, Vollbild sowie Schließen/Öffnen. Dabei wurde keine Werbung oder Werbeblocker-Sperre beobachtet. **Dauerhafte Werbefreiheit wird nicht garantiert.** Die private, bestehende Browser-Sitzung wurde nicht untersucht; ihre konkrete YouTube-Erkennungsursache ist nicht isoliert nachgewiesen.

  Die gezielten Menüprüfungen einschließlich Mining bestehen. Die bisherige allgemeine Menü-/UI-Suite ist damit **nicht insgesamt als bestanden** ausgewiesen. Der bekannte Windows-Steam-Unit-Test aus dem Ausgangsstand und dessen Testdaten-/Registry-Problem bleiben gesondert dokumentiert. Die vorhandene VM war nicht als verlässlich laufende Testumgebung verfügbar; insbesondere bleibt der **VM-Nachweis für symbolische Links** offen. Hinzu kommen die dokumentierten umgebungsabhängigen Pfadfälle (eigener 8.3-Kurzname und subst). Eine neue vollständige VM-Installations-/Updater-Serie und alle Windows-Skalierungsstufen sind nicht nachgewiesen.

  Veröffentlichung ausschließlich auf `source` und `updates`. `stable`, `main` und die lokale Installation bleiben unverändert. Empfehlung: gezielter Testkanal-Einsatz mit eigener Prüfung der gewohnten Widgets, Notizen und Brave-Wiedergabe; noch keine Stable-Freigabe.
